name: Build NuGet Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TwitcherSharp/TwitcherSharp.csproj

      - name: Build
        run: dotnet build TwitcherSharp/TwitcherSharp.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack TwitcherSharp/TwitcherSharp.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitchersharp-nuget
          path: ./artifacts/*.nupkg
          if-no-files-found: error