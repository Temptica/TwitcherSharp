name: Build and Publish NuGet Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TwitcherSharp/TwitcherSharp.csproj

      - name: Build
        run: dotnet build TwitcherSharp/TwitcherSharp.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack TwitcherSharp/TwitcherSharp.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitchersharp-nuget
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
