name: Build and Publish NuGet Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TwitcherSharp/TwitcherSharp.csproj

      - name: Build
        run: dotnet build TwitcherSharp/TwitcherSharp.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack TwitcherSharp/TwitcherSharp.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitchersharp-nuget
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # enable GitHub OIDC token issuance for nuget.org trusted publishing

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: twitchersharp-nuget
          path: ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Temptica

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
